<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parent Control | JMC Innovators</title>
<meta name="description" content="Monitor and guide your child's JMC Innovators learning account.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app-shell.css">
<style>
  .kid-strip{display:flex; gap:12px; overflow-x:auto; padding-bottom:4px; margin-bottom:20px;}
  .kid-chip{
    flex-shrink:0; display:flex; align-items:center; gap:10px; padding:10px 16px 10px 10px;
    border-radius:999px; border:1.5px solid var(--border); background:var(--panel-2); cursor:pointer; transition:.2s var(--ease);
  }
  .kid-chip.selected{border-color:var(--blue-2); background:linear-gradient(135deg, rgba(99,102,241,.16), rgba(139,92,246,.08)); box-shadow:0 0 0 3px rgba(99,102,241,.13);}
  .kid-chip .shell-avatar{width:32px; height:32px; font-size:12px;}
  .kid-chip-name{font-size:12.8px; font-weight:700;}
  .kid-chip-status{width:8px; height:8px; border-radius:50%; margin-left:2px;}
  .add-kid-chip{flex-shrink:0; display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:999px; border:1.5px dashed var(--border); color:var(--text-2); font-weight:700; font-size:12.6px;}

  .pc-tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:20px; overflow-x:auto;}
  .pc-tab{padding:11px 16px; font-size:13px; font-weight:700; color:var(--text-2); border-bottom:2px solid transparent; white-space:nowrap;}
  .pc-tab.active{color:var(--text-0); border-color:var(--blue-2);}
  .pc-panel{display:none;}
  .pc-panel.active{display:block; animation:fadeUp .35s var(--ease-out);}

  .control-group-title{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--text-3); margin:22px 0 10px;}
  .control-group-title:first-child{margin-top:0;}
  .subject-chip{display:inline-flex; align-items:center; padding:7px 13px; border-radius:999px; border:1.5px solid var(--border); background:var(--panel-2); font-size:12px; font-weight:700; cursor:pointer; margin:0 6px 6px 0; transition:.2s var(--ease);}
  .subject-chip.on{border-color:var(--green); background:rgba(34,197,94,.14); color:#6ee7b7;}
  .limit-row{display:flex; align-items:center; gap:12px;}
  .limit-row input[type=range]{flex:1; accent-color:var(--blue-2);}
  .limit-val{width:70px; text-align:right; font-weight:800; font-size:13px;}

  .timeline-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border-soft);}
  .timeline-item:last-child{border-bottom:none;}
  .timeline-dot{width:8px; height:8px; border-radius:50%; margin-top:6px; flex-shrink:0;}

  .code-display{font-family:'Sora',sans-serif; font-size:38px; font-weight:800; letter-spacing:.15em; text-align:center; padding:20px; border-radius:var(--r-lg); background:var(--panel-2); border:1px dashed var(--border); margin:16px 0;}
  .code-timer{text-align:center; font-size:12px; color:var(--text-2);}

  .emergency-card{border:1px solid rgba(239,68,68,.35); background:rgba(239,68,68,.05); border-radius:var(--r-lg); padding:18px;}
  .pin-dots{display:flex; gap:10px; justify-content:center; margin:18px 0;}
  .pin-dot{width:14px; height:14px; border-radius:50%; border:2px solid var(--border);}
  .pin-dot.filled{background:var(--blue-2); border-color:var(--blue-2);}
  .pin-keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:220px; margin:0 auto;}
  .pin-keypad button{padding:14px 0; border-radius:12px; background:var(--panel-2); border:1px solid var(--border); font-size:16px; font-weight:700; color:var(--text-0);}
</style>
</head>
<body class="app-body">

<div id="appShellRoot"></div>

<script type="module" src="/js/parent-control.page.js"></script>
<script src="/js/register-sw.js"></script>
</body>
</html>
