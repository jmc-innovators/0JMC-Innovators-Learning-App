  });
  document.getElementById('tc-msg-send')?.addEventListener('click',()=>{
    const inp=document.getElementById('tc-msg-inp'); const key=document.getElementById('tc-msg-send').dataset.msgkey;
    if(!inp||!key) return;
    const text=inp.value.trim(); if(!text) return;
    dbSet(d=>{if(!d.messages[key])d.messages[key]=[];d.messages[key].push({from:'teacher',text,ts:fts(),readByStudent:false});});
    inp.value=''; APP._tcPage=APP._tcPage; render();
  });
  document.getElementById('open-post-btn')?.addEventListener('click',()=>openModal('m-post'));
  document.getElementById('m-post-close')?.addEventListener('click',()=>closeModal('m-post'));
  document.getElementById('m-post-close2')?.addEventListener('click',()=>closeModal('m-post'));
  document.getElementById('p-save')?.addEventListener('click',()=>{
    const t=document.getElementById('p-title').value.trim(); const b=document.getElementById('p-body').value.trim();
    if(!t||!b){document.getElementById('p-err').style.display='flex';return;}
    const btn=document.getElementById('p-save'); const cid=btn.dataset.cls; const subj=btn.dataset.subj;
    dbSet(d=>{if(d.classes[cid])d.classes[cid].posts.push({id:'p'+Date.now(),title:t,body:b,att:document.getElementById('p-att').value.trim(),attType:document.getElementById('p-att-type').value,subj,tid:APP.user.id,date:fdt()});});
    closeModal('m-post'); render();
  });
  document.getElementById('open-work-btn')?.addEventListener('click',()=>openModal('m-work'));
  document.getElementById('m-work-close')?.addEventListener('click',()=>closeModal('m-work'));
  document.getElementById('m-work-close2')?.addEventListener('click',()=>closeModal('m-work'));
  document.getElementById('w-save')?.addEventListener('click',()=>{
    const t=document.getElementById('w-title').value.trim();
    if(!t){document.getElementById('w-err').style.display='flex';return;}
    const btn=document.getElementById('w-save'); const cid=btn.dataset.cls; const subj=btn.dataset.subj;
    dbSet(d=>{if(d.classes[cid])d.classes[cid].work.push({id:'w'+Date.now(),title:t,inst:document.getElementById('w-inst').value.trim(),wtype:document.getElementById('w-type').value,maxMarks:document.getElementById('w-max').value.trim(),due:document.getElementById('w-due').value.trim()||'No due date',subj,tid:APP.user.id});});

  document.getElementById('m-mat-close2')?.addEventListener('click',()=>closeModal('m-mat'));
  document.getElementById('mt-save')?.addEventListener('click',()=>{
    const t=document.getElementById('mt-title').value.trim(); const a=document.getElementById('mt-att').value.trim();
    if(!t||!a){document.getElementById('mt-err').style.display='flex';return;}

function wsAutosave(clsId, wId, stName) {
  const editor=document.getElementById('ws-editor');
  if(!editor) return;
  const text=editor.innerText.trim();
  const key=`${clsId}_${wId}_${stName}`;
  dbSet(d=>{if(!d.submissions)d.submissions={};if(!d.submissions[key]||!d.submissions[key].submitted)d.submissions[key]={text,submitted:false,ts:null};});
  const st=document.getElementById('ws-status');
  if(st){st.textContent='Draft saved';setTimeout(()=>{if(st)st.textContent='';},2000);}
}

function execCmd(cmd) {
  document.execCommand(cmd,false,null);
  document.getElementById('ws-editor')?.focus();
}

// ── QUIZ ENGINE ───────────────────────────────
function renderQBlock(el, key) {
  const qs = APP.quizState[key];
  if (!qs) return;
  const d = db();
  const cls = d.classes[qs.clsId];
  if (!cls) return;
  if (qs.done) {
    const totalM = qs.qs.reduce((a,q)=>a+(parseInt(q.marks)||1),0);
    const pct = totalM ? Math.round(qs.marks/totalM*100) : 0;
    el.innerHTML=`<div style="text-align:center;padding:20px">
      <div class="jf" style="font-size:36px;font-weight:700;color:${pct>=70?'var(--green)':pct>=40?'var(--amber)':'var(--red)'}">${qs.marks}/${totalM}</div>
      <div style="font-size:13px;color:var(--text2);margin:6px 0 4px">${pct}% · ${qs.score}/${qs.qs.length} correct</div>
      <div style="font-size:13px;color:var(--text);margin-bottom:10px">${pct>=70?'Excellent! ':pct>=40?'Good effort!':'Keep studying!'}</div>
      <div class="info-box">Result saved. Your teacher can see your score.</div>
    </div>`;
    dbSet(db2=>{
      if(!db2.classes[qs.clsId].quizResults)db2.classes[qs.clsId].quizResults={};
      if(!db2.classes[qs.clsId].quizResults[APP.user.name])db2.classes[qs.clsId].quizResults[APP.user.name]={};
      db2.classes[qs.clsId].quizResults[APP.user.name][qs.subj]={correct:qs.score,marks:qs.marks,total:qs.qs.length,date:fdt()};
    });
    delete APP.quizState[key];
    return;
  }
  const q=qs.qs[qs.cur];
  el.innerHTML=`<div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:9px;font-weight:700">${qs.subj} — Q${qs.cur+1}/${qs.qs.length}</div>
    <div class="jf" style="font-size:14px;font-weight:700;margin-bottom:11px;line-height:1.5">${escH(q.q)} <span class="bdg camber">${q.marks||1} mark${(q.marks||1)>1?'s':''}</span></div>
    ${q.opts.map((o,i)=>`<button class="qopt" id="qo_${key}_${i}">${['A','B','C','D'][i]}. ${escH(o)}</button>`).join('')}
    <div id="qfb_${key}" style="font-size:12px;padding:7px 10px;border-radius:var(--r);margin-top:5px;display:none"></div>
    <button id="qnxt_${key}" style="display:none;margin-top:9px" class="bp bsm">${qs.cur>=qs.qs.length-1?'See results':'Next question'}</button>
  </div>`;
  q.opts.forEach((_,i)=>{
    document.getElementById(`qo_${key}_${i}`)?.addEventListener('click',()=>stAnsQ(key,i,q.ans,parseInt(q.marks)||1));
  });
  document.getElementById(`qnxt_${key}`)?.addEventListener('click',()=>{
    const qs2=APP.quizState[key]; if(!qs2) return;
    qs2.cur++; qs2.answered=false;
    if(qs2.cur>=qs2.qs.length) qs2.done=true;
    renderQBlock(el,key);
  });
}

function stAnsQ(key,i,ans,marks){
  const qs=APP.quizState[key]; if(!qs||qs.answered) return;
  qs.answered=true;
  for(let j=0;j<4;j++){const b=document.getElementById(`qo_${key}_${j}`);if(b)b.disabled=true;}
  const fb=document.getElementById('qfb_'+key);
  if(fb)fb.style.display='block';
  if(i===ans){
    document.getElementById(`qo_${key}_${i}`)?.classList.add('ok');
    if(fb){fb.textContent=`Correct! +${marks} mark${marks>1?'s':''}`;fb.style.background='var(--green-bg)';fb.style.color='var(--green)';}
    qs.score++; qs.marks+=marks;
  } else {
    document.getElementById(`qo_${key}_${i}`)?.classList.add('no');
    document.getElementById(`qo_${key}_${ans}`)?.classList.add('ok');
    if(fb){fb.textContent='Incorrect. Correct: '+['A','B','C','D'][ans]+'. '+qs.qs[qs.cur].opts[ans];fb.style.background='var(--red-bg)';fb.style.color='var(--red)';}
  }
  document.getElementById('qnxt_'+key)?.style.setProperty('display','inline-block');
}

function openModal(id) { const el=document.getElementById(id); if(el) el.classList.add('show'); }

// ── BOOT ──────────────────────────────────────
// Pure localStorage app: no network round-trip needed, so boot is instant —
// just restore whichever account (if any) was last signed in.
function bootApp() {
  initFirebase();
  if (!FB_READY) { APP.screen = 'land'; render(); return; }
  APP.screen = 'boot';
  render();
  FB_AUTH.onAuthStateChanged(async (fbUser) => {
    if (!fbUser) {
      if (APP.screen === 'boot') { APP.screen = 'land'; render(); }
      return;
    }
    try {
      const profile = await bootstrapUserProfile(fbUser);
      const user = await loadAppUserFromProfile(profile);
      APP.user = user;
      const target = ROLE_SCREENS[user.role];
      APP[target.pageVar] = APP[target.pageVar] || target.defaultPage;
      APP.screen = target.screen;
      await loadOrgIntoState();
      render();
    } catch (e) {
      console.error('Session restore failed', e);
      await fbSignOut();
      APP.screen = 'land';
      render();
    }
  });
}

bootApp();
