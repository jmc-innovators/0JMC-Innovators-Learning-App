<style>
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2230;--bg4:#21262d;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e6edf3;--text2:#8b949e;--text3:#6e7681;
  --blue:#4a90e8;--blue2:#1f6feb;--blue-bg:rgba(74,144,232,0.10);
  --green:#3fb950;--green-bg:rgba(63,185,80,0.10);
  --purple:#a371f7;--purple-bg:rgba(163,113,247,0.10);
  --amber:#e3b341;--amber-bg:rgba(227,179,65,0.10);
  --red:#f85149;--red-bg:rgba(248,81,73,0.10);
  --teal:#39d3bb;--teal-bg:rgba(57,211,187,0.10);
  --r:10px;--rl:14px;
  --ease:cubic-bezier(.22,.9,.32,1);
  --shadow-sm:0 1px 2px rgba(0,0,0,.24);
  --shadow-md:0 6px 20px rgba(0,0,0,.28);
  --shadow-lg:0 16px 40px rgba(0,0,0,.38);
  --focus-ring:0 0 0 3px rgba(74,144,232,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.jf{font-family:'Plus Jakarta Sans',sans-serif}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--border2);border:2px solid transparent;background-clip:padding-box}
input,select,textarea{font-family:'DM Sans',sans-serif;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:10px 12px;color:var(--text);font-size:13px;width:100%;outline:none;transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:var(--focus-ring)}
select option{background:var(--bg3)}
textarea{resize:vertical;min-height:75px;line-height:1.55}
input::placeholder,textarea::placeholder{color:var(--text3)}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;border:none;border-radius:var(--r);font-size:13px;font-weight:600;padding:9px 16px;transition:transform .15s var(--ease),filter .15s var(--ease),background .15s var(--ease),box-shadow .15s var(--ease);letter-spacing:.1px}
button:active{transform:scale(.97)}
.bp{background:linear-gradient(135deg,var(--blue2),#3b7de8);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 2px 8px rgba(31,111,235,.28)}.bp:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 6px 18px rgba(31,111,235,.42)}
.bg{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(63,185,80,.25)}.bg:hover{filter:brightness(1.08)}
.bs2{background:var(--bg4);color:var(--text);border:1px solid var(--border2)}.bs2:hover{background:var(--bg3);border-color:rgba(255,255,255,.2)}
.bdng{background:var(--red-bg);color:var(--red);border:1px solid rgba(248,81,73,.25)}.bdng:hover{filter:brightness(1.15)}
.bgh{background:transparent;color:var(--text2);border:1px solid var(--border)}.bgh:hover{background:var(--bg4);color:var(--text);border-color:var(--border2)}
.bsm{padding:6px 11px!important;font-size:12px!important;border-radius:8px!important}
.frow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lbl{display:block;font-size:10px;font-weight:700;color:var(--text3);margin-bottom:4px;margin-top:10px;text-transform:uppercase;letter-spacing:.6px}
.errtxt{font-size:12px;color:var(--red);margin-top:4px;display:flex;align-items:center;gap:4px}
.bdg{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
.cblue{background:var(--blue-bg);color:var(--blue)}
.cgreen{background:var(--green-bg);color:var(--green)}
.cpurple{background:var(--purple-bg);color:var(--purple)}
.camber{background:var(--amber-bg);color:var(--amber)}
.cred{background:var(--red-bg);color:var(--red)}
.cteal{background:var(--teal-bg);color:var(--teal)}
.cgray{background:rgba(255,255,255,.05);color:var(--text2)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:16px;box-shadow:var(--shadow-sm)}
/* APP SHELL */
.app{display:flex;height:100vh;overflow:hidden}
.sbar{width:224px;background:var(--bg2);border-right:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;padding:12px 0;position:relative;z-index:10;overflow-y:auto}
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.topbar-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;color:var(--text);flex:1}
.topbar-signout{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:var(--r);padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s var(--ease);flex-shrink:0}
.topbar-signout:hover{background:var(--red-bg);border-color:rgba(248,81,73,.35);color:var(--red)}
.imp-banner{background:linear-gradient(90deg,#7c3aed,#1f6feb);color:#fff;font-size:12.5px;font-weight:500;padding:9px 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0;box-shadow:0 2px 10px rgba(124,58,237,.25)}
.imp-role{background:rgba(255,255,255,.18);padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.3px}
.imp-return{margin-left:auto;background:rgba(255,255,255,.95);color:#4c1d95;border:none;border-radius:8px;padding:5px 12px;font-size:11.5px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s}
.imp-return:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.content-scroll{flex:1;overflow-y:auto;padding:20px}
.content-inner{max-width:900px}
/* SIDEBAR */
.sb-logo{padding:0 12px 12px;border-bottom:1px solid var(--border);margin-bottom:8px;display:flex;align-items:center;gap:9px}
.sb-ni{display:flex;align-items:center;gap:9px;padding:8px 12px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-radius:9px;margin:1px 6px;transition:background .16s var(--ease),color .16s var(--ease);position:relative}
.sb-ni:hover{background:var(--bg3);color:var(--text)}
.sb-ni.active{background:var(--blue-bg);color:var(--blue);font-weight:700}
.sb-ni.active::before{content:'';position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:3px;background:var(--blue2)}
.sb-ni-ico{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sb-sep{height:1px;background:var(--border);margin:6px 12px}
.sb-lbl{font-size:10px;font-weight:700;color:var(--text3);padding:4px 18px 2px;text-transform:uppercase;letter-spacing:.8px}
.sb-foot{margin-top:auto;padding:10px 12px 0;border-top:1px solid var(--border)}
.user-chip{display:flex;align-items:center;gap:8px;padding:7px;border-radius:var(--r);cursor:pointer;transition:background .15s}
.user-chip:hover{background:var(--bg3)}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-family:'Plus Jakarta Sans',sans-serif}
/* NOTIF BADGE */
.nbadge{position:absolute;top:5px;right:8px;background:var(--red);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:14px;text-align:center;cursor:pointer;transition:border-color .18s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease)}
.stat-card:hover{border-color:rgba(74,144,232,.35);transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.28),var(--shadow-md)}
.stat-num{font-family:'Plus Jakarta Sans',sans-serif;font-size:24px;font-weight:700;margin-top:2px}
.stat-lbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
/* TABS */
.tabs{display:flex;gap:2px;background:var(--bg3);border-radius:10px;padding:3px;margin-bottom:16px;overflow-x:auto;flex-shrink:0}
.tabn{padding:6px 13px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;border-radius:8px;white-space:nowrap;transition:background .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease);font-family:'Plus Jakarta Sans',sans-serif}
.tabn:hover{color:var(--text)}
.tabn.on{background:var(--bg2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3)}
/* POSTS */
.post-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:14px;margin-bottom:8px}
.post-card:hover{border-color:var(--border2)}
.post-body-txt{font-size:13px;color:var(--text2);line-height:1.65}
/* WORK */
.work-item{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:7px}
.work-item:hover{border-color:var(--border2)}
.work-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
/* STUDENT ROW */
.st-row{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:6px}
/* QUIZ */
.qopt{width:100%;text-align:left;padding:11px 13px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);font-size:13px;cursor:pointer;color:var(--text);margin-bottom:6px;font-family:'DM Sans',sans-serif;transition:background .16s var(--ease),border-color .16s var(--ease),transform .1s var(--ease)}
.qopt:active:not(:disabled){transform:scale(.99)}
.qopt:hover:not(:disabled){background:var(--bg4);border-color:var(--border2)}
.qopt.ok{background:var(--green-bg);border-color:rgba(63,185,80,.3);color:var(--green)}
.qopt.no{background:var(--red-bg);border-color:rgba(248,81,73,.3);color:var(--red)}
/* CLASS CARD */
.cls-card{border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;cursor:pointer;background:var(--bg2);transition:border-color .2s var(--ease),transform .2s var(--ease),box-shadow .2s var(--ease);margin-bottom:8px}
.cls-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.cls-banner{height:70px;position:relative;display:flex;align-items:flex-end;padding:9px 13px}
.cls-banner::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.28)}
.cls-bc{position:relative;z-index:1}
.cls-banner-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;color:#fff}
.cls-banner-sub{font-size:11px;color:rgba(255,255,255,.68);margin-top:1px}
.cls-footer{padding:9px 13px;display:flex;align-items:center;justify-content:space-between}
/* CODE BOX */
.code-box{background:var(--blue-bg);border:1px solid rgba(74,144,232,.2);border-radius:var(--rl);padding:11px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.code-val{font-size:22px;font-weight:700;color:var(--blue);letter-spacing:5px;font-family:'Plus Jakarta Sans',sans-serif}
/* INFO BOX */
.info-box{background:var(--blue-bg);border:1px solid rgba(74,144,232,.18);border-radius:var(--r);padding:9px 13px;font-size:12px;color:var(--blue);margin-bottom:10px;line-height:1.6}
.sep{height:1px;background:var(--border);margin:14px 0}
/* EMPTY */
.empty{text-align:center;padding:32px;color:var(--text3)}
.empty-ico{font-size:36px;margin-bottom:8px;opacity:.3}
/* WELCOME BANNER */
.wb{border-radius:var(--rl);padding:18px 20px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
/* SUBJ PILLS */
.spill{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--text2);background:var(--bg3);transition:all .15s;font-family:'Plus Jakarta Sans',sans-serif}
.spill:hover{border-color:var(--border2);color:var(--text)}
.spill.on{background:var(--blue2);color:#fff;border-color:var(--blue2)}
/* TABLE */
.trk-table{width:100%;border-collapse:collapse;font-size:12px}
.trk-table th{text-align:left;padding:8px 12px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:var(--bg3);position:sticky;top:0}
.trk-table td{padding:9px 12px;color:var(--text);border-bottom:1px solid var(--border);vertical-align:middle}
.trk-table tr:hover td{background:rgba(255,255,255,.02)}
/* MARK PILL */
.mk{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
.mk-hi{background:var(--green-bg);color:var(--green)}
.mk-md{background:var(--amber-bg);color:var(--amber)}
.mk-lo{background:var(--red-bg);color:var(--red)}
.mk-ns{background:var(--bg4);color:var(--text3)}
.att-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--border2);background:var(--bg3);color:var(--text3);font-size:14px;font-weight:700;cursor:pointer;transition:all .15s var(--ease)}
.att-btn:hover{border-color:var(--border2);filter:brightness(1.15)}
.att-btn.on-green{background:var(--green-bg);color:var(--green);border-color:rgba(46,160,67,.4)}
.att-btn.on-amber{background:var(--amber-bg);color:var(--amber);border-color:rgba(158,106,3,.4)}
.att-btn.on-red{background:var(--red-bg);color:var(--red);border-color:rgba(218,54,51,.4)}
/* MATERIAL */
.mat-card{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:7px}
.mat-card:hover{border-color:var(--border2)}
/* MODAL */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:900;align-items:center;justify-content:center;padding:16px}
.modal-ov.show{display:flex}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rl);padding:20px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;color:var(--text)}
/* LANDING */
.land-wrap{min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(74,144,232,.14),transparent 55%),radial-gradient(circle at 85% 90%,rgba(124,58,237,.10),transparent 50%),radial-gradient(circle at 5% 85%,rgba(10,122,108,.08),transparent 45%),var(--bg);display:flex;align-items:center;justify-content:center;padding:18px}
.land-card{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:34px 28px;width:100%;max-width:370px;text-align:center;box-shadow:var(--shadow-lg),0 0 60px rgba(31,111,235,.06)}
.land-btn{display:flex;align-items:center;gap:9px;padding:12px 14px;border-radius:var(--rl);border:1px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:13px;transition:border-color .18s var(--ease),background .18s var(--ease),transform .18s var(--ease);text-align:left;margin-bottom:7px;width:100%}
.land-btn:hover{border-color:var(--border2);background:var(--bg4);transform:translateX(2px)}
.land-btn:active{transform:scale(.98)}
.land-btn-ico{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
/* OTP */
.otp-wrap{display:flex;gap:8px;justify-content:center;margin:14px 0}
.otp-inp{width:44px;height:52px;text-align:center;font-size:22px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg3);border:2px solid var(--border2);border-radius:10px;color:var(--text);outline:none;padding:0;transition:border-color .2s}
.otp-inp:focus{border-color:var(--blue)}
.otp-inp.filled{border-color:var(--green)}
/* MESSAGING */
.msg-bubble{max-width:76%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.6}
.msg-bubble.mine{background:var(--blue2);color:#fff;border-radius:14px 4px 14px 14px;align-self:flex-end}
.msg-bubble.theirs{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:4px 14px 14px 14px;align-self:flex-start}
.msg-ts{font-size:10px;margin-top:3px;opacity:.6;text-align:right}
.msg-ts.theirs{text-align:left}
.msg-contact{display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:var(--rl);background:var(--bg2);border:1px solid var(--border);margin-bottom:6px;cursor:pointer;transition:all .15s}
.msg-contact:hover,.msg-contact.active{border-color:var(--blue);background:var(--blue-bg)}
/* WORKSPACE */
.ws-bar{display:flex;gap:3px;padding:7px 10px;background:var(--bg4);border:1px solid var(--border2);border-bottom:none;border-radius:var(--rl) var(--rl) 0 0;flex-wrap:wrap}
.ws-btn{background:none;border:1px solid transparent;color:var(--text2);padding:3px 7px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600}
.ws-btn:hover{background:var(--bg3);color:var(--text)}
.ws-editor{background:var(--bg3);border:1px solid var(--border2);border-radius:0 0 var(--rl) var(--rl);min-height:180px;padding:14px;color:var(--text);font-size:14px;line-height:1.8;outline:none;font-family:'DM Sans',sans-serif;width:100%}
.ws-editor:focus{border-color:var(--blue)}
.ws-editor:empty::before{content:attr(data-ph);color:var(--text3);pointer-events:none}
/* TOAST */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:10px 16px;font-size:13px;color:var(--text);display:flex;align-items:center;gap:8px;pointer-events:none;animation:toastIn .25s ease;max-width:300px}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.toast.success{border-color:rgba(63,185,80,.3);background:var(--green-bg);color:var(--green)}
.toast.error{border-color:rgba(248,81,73,.3);background:var(--red-bg);color:var(--red)}
/* ACTIVITY */
.act-row{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--border)}
.act-row:last-child{border-bottom:none}
.act-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
/* SUBMISSION */
.sub-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rl);padding:12px;margin-bottom:8px}
.sub-card:hover{border-color:var(--border2)}
/* SECTION PAGES */
.sp{display:none}.sp.on{display:block}
/* TAB PANELS */
.tp{display:none}.tp.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

<!-- Firebase (compat build — keeps everything global so the app's existing
     inline onclick="..." handlers keep working with zero restructuring) -->
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-compat.js"></script>

<script>
// ═══════════════════════════════════════════════
//  JMC CLASSROOM — Full Working App
//  Database: Cloud Firestore (Operator/School/Supervisor/Teacher account
//  layer migrated — see MIGRATION NOTES below). Classes and everything
//  nested inside them are still on localStorage pending the next phase.
//  Messaging: student ↔ teacher direct messages
//  Workspace: student work submission + teacher review
// ═══════════════════════════════════════════════

// ── Firebase ───────────────────────────────────
// This apiKey/appId are meant to be public in client-side web apps — they
// are not secrets. Real access control happens in Firestore Security Rules
// (see firestore.rules), not by hiding this object.
const firebaseConfig = {
  apiKey: "AIzaSyBLYuM8ycUK4AYkCJaqdxZpxvLnA-Lx374",
  authDomain: "jmc-class.firebaseapp.com",
  projectId: "jmc-class",
  storageBucket: "jmc-class.firebasestorage.app",
  messagingSenderId: "264700474615",
  appId: "1:264700474615:web:701719833c85d135a78ff2"
};
let FB_APP = null, FB_AUTH = null, FB_DB = null, FB_READY = false;
function initFirebase() {
  try {
    FB_APP = firebase.initializeApp(firebaseConfig);
    FB_AUTH = firebase.auth();
    FB_DB = firebase.firestore();
    FB_READY = true;
  } catch (e) {
    console.error('Firebase init failed', e);
    FB_READY = false;
  }
}
const GOOGLE_PROVIDER = () => { const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' }); return p; };

const OP_KEY = 'jmc2027';
const OP_EMAIL = 'operator@jmc.internal';
const REG_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSfR0zDqpybVW84ljOkKt2Sh2_pa-oLH2HmO3fKK0eKhj_V7kw/viewform?usp=publish-editor';
const ALL_SUBJS = ['Science','Maths','English','Sinhala','Tamil','History','ICT'];
const SUBJ_C = {Science:'cgreen',Maths:'cblue',English:'cpurple',Sinhala:'camber',Tamil:'camber',History:'cred',ICT:'cteal'};
const BCOLS = ['#1f6feb','#238636','#9e6a03','#da3633','#8957e5','#0a7a6c','#6e40c9','#1a7f74'];
const ATT_I = {link:'🔗',pdf:'📄',doc:'📝',img:'🖼',video:'🎬',form:'📋',notes:'📄',slides:'🖼',audio:'🎵',other:'📎'};

// ── State ──────────────────────────────────────
let APP = {
  screen: 'land',  // current top-level screen
  user: null,      // { role: 'operator'|'school'|'supervisor'|'teacher'|'student', ...data }
  curClsId: null,
  curTcTab: 0,
  curStSubj: 'All',
  msgContactId: null,
  quizState: {},
  courseContainer: null,
};

// ── Live in-memory cache ─────────────────────────
// Mirrors the org/auth layer (schools, supervisors, teachers), now read from
// Cloud Firestore instead of localStorage. render() reads from here
// synchronously; loadOrgIntoState() refreshes it after every write.
let STATE = { schools:{}, supervisors:{}, teachers:{} };
let LISTENERS = {};
function fbClearListeners() {
  Object.values(LISTENERS).forEach(unsub => { try { unsub(); } catch {} });
  LISTENERS = {};
}
function fbClearImpersonationListeners() { fbClearListeners(); }

// ── Database (classes/posts/work/materials/attendance/marks/quiz/messages/
// submissions — NOT migrated yet. This phase only moves the account layer
// above to Firestore. The next phase moves this block.) ──────────────
function dbLoad() {
  try { return JSON.parse(localStorage.getItem('jmc7') || '{}'); }
  catch { return {}; }
}
function dbSave(d) { try { localStorage.setItem('jmc7', JSON.stringify(d)); } catch {} }
function db() {
  const d = dbLoad();
  if (!d.classes) d.classes = {};
  if (!d.messages) d.messages = {};
  if (!d.submissions) d.submissions = {};
  if (!d.schools) d.schools = {};
  if (!d.supervisors) d.supervisors = {};
  if (!d.teachers) d.teachers = {};
  return d;
}
function dbSet(fn) { const d = db(); fn(d); dbSave(d); return d; }

// ── Local helpers ──────────────────────────────────
function uid() { return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9); }
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error('FILE_READ_FAILED'));
    r.readAsDataURL(file);
  });
}
function saveSession(role, id) { try { localStorage.setItem('jmc_session', JSON.stringify({ role, id })); } catch {} }
function clearSession() { try { localStorage.removeItem('jmc_session'); } catch {} }

// ── Firestore helpers ──────────────────────────
function fsDoc(col, id) { return FB_DB.collection(col).doc(id); }
function setFromSnap(key, snap) {
  STATE[key] = {};
  snap.forEach(doc => STATE[key][doc.id] = { id: doc.id, ...doc.data() });
}

// Loads whatever slice of the org tree the current signed-in role can see.
// Deliberately a plain read-and-cache (not a live onSnapshot listener) —
// schools/supervisors/teachers change rarely, so refreshing after each
// write is simpler and cheaper here. Real-time listeners are reserved for
// where they actually matter: chat, announcements, notifications,
// attendance, class updates (coming in later phases).
async function loadOrgIntoState() {
  if (!FB_READY || !APP.user) return;
  const role = APP.user.role;
  try {
    if (role === 'operator') {
      const [sc, sv, tc] = await Promise.all([
        FB_DB.collection('schools').get(),
        FB_DB.collection('supervisors').get(),
        FB_DB.collection('teachers').get(),
      ]);
      setFromSnap('schools', sc); setFromSnap('supervisors', sv); setFromSnap('teachers', tc);
    } else if (role === 'school') {
      const [sv, tc] = await Promise.all([
        FB_DB.collection('supervisors').where('schoolId','==',APP.user.id).get(),
        FB_DB.collection('teachers').where('schoolId','==',APP.user.id).get(),
      ]);
      setFromSnap('supervisors', sv); setFromSnap('teachers', tc);
    } else if (role === 'supervisor') {
      const tc = await FB_DB.collection('teachers').where('supervisorId','==',APP.user.id).get();
      setFromSnap('teachers', tc);
    }
  } catch (e) { console.error('loadOrgIntoState', e); }
}

// ── Google sign-in ──────────────────────────────
// All five roles use the same button; role is never chosen up front by the
// person — it's resolved from Firestore after they sign in.
async function googleSignInFlow() {
  const cred = await FB_AUTH.signInWithPopup(GOOGLE_PROVIDER());
  const profile = await bootstrapUserProfile(cred.user);
  return loadAppUserFromProfile(profile);
}

// Reads (or creates, on first sign-in) users/{uid}. The role is never
// chosen by the client — it's looked up once from invites/{email} (written
// by whoever created the account: Operator/School/Supervisor) and then
// locked into users/{uid}. Firestore rules only let a user write a role on
// their own document that matches invites/{email}, so nobody can grant
// themselves access by editing client-side code.
async function bootstrapUserProfile(fbUser) {
  const uref = fsDoc('users', fbUser.uid);
  const existing = await uref.get();
  if (existing.exists && existing.data().role) {
    uref.set({ displayName: fbUser.displayName||'', photoURL: fbUser.photoURL||'', updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge:true }).catch(()=>{});
    return { uid: fbUser.uid, ...existing.data() };
  }
  const email = (fbUser.email || '').toLowerCase();
  const inviteSnap = await fsDoc('invites', email).get();
  const invite = inviteSnap.exists ? inviteSnap.data() : { role: 'student' };
  const profile = {
    email,
    displayName: fbUser.displayName || '',
    photoURL: fbUser.photoURL || '',
    role: invite.role,
    roleRefId: invite.roleRefId || null,
    schoolId: invite.schoolId || null,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  };
  await uref.set(profile, { merge:true });
  return { uid: fbUser.uid, ...profile };
}

// Builds the same APP.user shape the rest of the app already expects, by
// pulling the matching org document now that the role is known.
async function loadAppUserFromProfile(profile) {
  if (profile.role === 'operator') {
    return { role:'operator', id:'operator', name:'Operator', uid:profile.uid, email:profile.email };
  }
  if (profile.role === 'school') {
    const doc = await fsDoc('schools', profile.roleRefId).get();
    if (!doc.exists) throw new Error('SCHOOL_NOT_FOUND');
    return { role:'school', id:doc.id, ...doc.data(), uid:profile.uid, email:profile.email };
  }
  if (profile.role === 'supervisor') {
    const doc = await fsDoc('supervisors', profile.roleRefId).get();
    if (!doc.exists) throw new Error('SUPERVISOR_NOT_FOUND');
    return { role:'supervisor', id:doc.id, ...doc.data(), uid:profile.uid, email:profile.email };
  }
  if (profile.role === 'teacher') {
    const doc = await fsDoc('teachers', profile.roleRefId).get();
    if (!doc.exists) throw new Error('TEACHER_NOT_FOUND');
    return { role:'teacher', id:doc.id, ...doc.data(), uid:profile.uid, email:profile.email };
  }
  // Student identity still runs on the existing join-a-classroom flow for
  // now — it migrates together with classes/classMembers in the next phase.
  return { role:'student', id:profile.uid, name:profile.displayName, uid:profile.uid, email:profile.email };
}

// ── Operator ───────────────────────────
// Bootstrap note: there's no in-app way to create the *first* Operator —
// that's intentional. Seed it once via the Firebase Console: add a document
// at invites/{your-gmail-address} with a field role = "operator". After
// that, sign in on the app itself with that Google account.

// ── Schools (Operator adds/removes; sign in with Google) ──
async function fbSubscribeSchools() { await loadOrgIntoState(); render(); }
async function fbSubscribeSchoolDoc(schoolId) { await loadOrgIntoState(); render(); }
async function fbCreateSchool(fields, logoFile) {
  const schoolId = uid();
  const accessCode = gCode();
  const adminEmail = (fields.adminEmail || '').trim().toLowerCase();
  if (!adminEmail) throw new Error('EMAIL_REQUIRED');
  let logoUrl = '';
  if (logoFile) { try { logoUrl = await fileToDataURL(logoFile); } catch {} }
  try {
    await fsDoc('invites', adminEmail).set({ role:'school', roleRefId: schoolId, schoolId });
  } catch (e) {
    if (e.code === 'permission-denied') throw new Error('EMAIL_TAKEN');
    throw e;
  }
  await fsDoc('schools', schoolId).set({ ...fields, adminEmail, logoUrl, accessCode, status:'active', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
  await loadOrgIntoState();
  return { schoolId, accessCode, adminEmail };
}
async function fbDeleteSchool(schoolId) {
  const [svSnap, tcSnap, schoolDoc] = await Promise.all([
    FB_DB.collection('supervisors').where('schoolId','==',schoolId).get(),
    FB_DB.collection('teachers').where('schoolId','==',schoolId).get(),
    fsDoc('schools', schoolId).get(),
  ]);
  const batch = FB_DB.batch();
  tcSnap.forEach(d => { batch.delete(d.ref); if (d.data().email) batch.delete(fsDoc('invites', d.data().email)); });
  svSnap.forEach(d => { batch.delete(d.ref); if (d.data().email) batch.delete(fsDoc('invites', d.data().email)); });
  if (schoolDoc.exists && schoolDoc.data().adminEmail) batch.delete(fsDoc('invites', schoolDoc.data().adminEmail));
  batch.delete(fsDoc('schools', schoolId));
  await batch.commit();
  await loadOrgIntoState();
}

// ── Supervisors (School adds/removes; sign in with Google) ──
async function fbSubscribeAllSupervisors() { await loadOrgIntoState(); render(); }
async function fbSubscribeSupervisorsForSchool(schoolId) { await loadOrgIntoState(); render(); }
async function fbSubscribeSupervisorDoc(svId) { await loadOrgIntoState(); render(); }
async function fbCreateSupervisor(schoolId, name, email) {
  email = (email || '').trim().toLowerCase();
  if (!email) throw new Error('EMAIL_REQUIRED');
  const svId = uid();
  try {
    await fsDoc('invites', email).set({ role:'supervisor', roleRefId: svId, schoolId });
  } catch (e) {
    if (e.code === 'permission-denied') throw new Error('EMAIL_TAKEN');
    throw e;
  }
  await fsDoc('supervisors', svId).set({ name, email, schoolId, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
  await loadOrgIntoState();
  return svId;
}
async function fbDeleteSupervisor(svId) {
  const svDoc = await fsDoc('supervisors', svId).get();
  const schoolId = svDoc.exists ? svDoc.data().schoolId : null;
  const tcSnap = schoolId ? await FB_DB.collection('teachers').where('schoolId','==',schoolId).get() : null;
  const batch = FB_DB.batch();
  if (tcSnap) tcSnap.forEach(d => { if (d.data().supervisorId === svId) { batch.delete(d.ref); if (d.data().email) batch.delete(fsDoc('invites', d.data().email)); } });
  if (svDoc.exists && svDoc.data().email) batch.delete(fsDoc('invites', svDoc.data().email));
  batch.delete(fsDoc('supervisors', svId));
  await batch.commit();
  await loadOrgIntoState();
}

// ── Teachers (Supervisor adds/removes; sign in with Google) ──
async function fbSubscribeTeachersForSupervisor(supervisorId, isImpersonation) { await loadOrgIntoState(); render(); }
async function fbSubscribeTeacherDoc(tcId) { await loadOrgIntoState(); render(); }
async function fbCreateTeacher(supervisorId, schoolId, name, email, subjects) {
  email = (email || '').trim().toLowerCase();
  if (!email) throw new Error('EMAIL_REQUIRED');
  const tcId = uid();
  try {
    await fsDoc('invites', email).set({ role:'teacher', roleRefId: tcId, schoolId, supervisorId });
  } catch (e) {
    if (e.code === 'permission-denied') throw new Error('EMAIL_TAKEN');
    throw e;
  }
  await fsDoc('teachers', tcId).set({ name, email, subjects: subjects||[], supervisorId, schoolId, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
  await loadOrgIntoState();
  return tcId;
}
async function fbDeleteTeacher(tcId) {
  const tcDoc = await fsDoc('teachers', tcId).get();
  const batch = FB_DB.batch();
  if (tcDoc.exists && tcDoc.data().email) batch.delete(fsDoc('invites', tcDoc.data().email));
  batch.delete(fsDoc('teachers', tcId));
  await batch.commit();
  await loadOrgIntoState();
}

// ── Helpers ────────────────────────────────────
function ini(n) { return (n||'?').trim().split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function avc(n) {
  const p=[['var(--blue)','var(--blue-bg)'],['var(--green)','var(--green-bg)'],['var(--amber)','var(--amber-bg)'],['var(--purple)','var(--purple-bg)'],['var(--red)','var(--red-bg)'],['var(--teal)','var(--teal-bg)']];
  return p[(n||'?').charCodeAt(0) % p.length];
}
function fdt() { return new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function fts() { return new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function gCode() { const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return Array.from({length:6},()=>c[Math.floor(Math.random()*c.length)]).join(''); }
function mkCls(v,mx) { if(v===undefined||v===''||v===null) return 'mk-ns'; const p=parseFloat(v)/parseFloat(mx)*100; return p>=70?'mk-hi':p>=40?'mk-md':'mk-lo'; }
function escH(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg, type='') {
  const w = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  w.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function unreadMsgCount(role) {
  // Count messages where the last message is from the other party (unread indicator)
  const d = db();
  if (!APP.user) return 0;
  let count = 0;
  Object.entries(d.messages || {}).forEach(([key, msgs]) => {
    if (!msgs || !msgs.length) return;
    const last = msgs[msgs.length - 1];
    if (role === 'teacher') {
      // Teacher sees unread if last message is from student and teacher hasn't read
      if (last.from === 'student' && !last.readByTeacher) count++;
    } else if (role === 'student') {
      if (last.from === 'teacher' && !last.readByStudent) count++;
    }
  });
  return count;
}

function renderSchool() {
  const d = db();
  const s = STATE.schools[APP.user?.id] || APP.user || {};
  const mySvs = Object.values(STATE.supervisors).filter(sv => sv.schoolId === s.id);
  const myTcCount = Object.values(STATE.teachers).filter(tc => mySvs.some(sv=>sv.id===tc.supervisorId)).length;
  const myStCount = Object.values(d.classes).filter(c => {
    const tc = STATE.teachers[c.tid]; return tc && mySvs.some(sv=>sv.id===tc.supervisorId);

  const pg = APP._schoolPage || 'dash';

function attachSchool() {
  document.getElementById('btn-add-schsv')?.addEventListener('click',()=>openModal('m-add-schsv'));
  document.getElementById('m-add-schsv-close')?.addEventListener('click',()=>closeModal('m-add-schsv'));
  document.getElementById('schsv-cancel')?.addEventListener('click',()=>closeModal('m-add-schsv'));
  document.getElementById('schsv-save')?.addEventListener('click',async ()=>{
    const name=document.getElementById('schsv-name').value.trim();
    const email=document.getElementById('schsv-email').value.trim().toLowerCase();
    const errEl=document.getElementById('schsv-err');
    const saveBtn=document.getElementById('schsv-save');
    errEl.style.display='none';
    if(!name||!email||!email.includes('@')){errEl.textContent='⚠ Fill in a name and a valid email';errEl.style.display='flex';return;}
    setBtnBusy(saveBtn, true, 'Creating…');
    try {
      const schoolId = APP.user.id;
      await fbCreateSupervisor(schoolId, name, email);
      document.getElementById('addschsv-form').style.display='none';
      document.getElementById('addschsv-creds').style.display='block';
      document.getElementById('schsvcred-user').textContent=email;
    } catch(e) {
      setBtnBusy(saveBtn, false);
      console.error(e);
      errEl.textContent = e.message==='EMAIL_TAKEN' ? '⚠ That email is already registered to another account' : '⚠ Could not create supervisor — check your connection';
      errEl.style.display='flex';
    }
  });
  document.getElementById('schsvcred-done')?.addEventListener('click',()=>{
    closeModal('m-add-schsv');
    document.getElementById('addschsv-form').style.display='block';
    document.getElementById('addschsv-creds').style.display='none';
    APP._schoolPage='supervisors'; render();
  });
  document.getElementById('schsvcred-copy')?.addEventListener('click',()=>{
    const u=document.getElementById('schsvcred-user').textContent;
    navigator.clipboard.writeText(`JMC Classroom — Supervisor Login\nSign in at JMC Classroom → Supervisor → Continue with Google, using ${u}`).catch(()=>{});
    toast('Copied!','success');
  });
  document.querySelectorAll('[data-rm-schsv]').forEach(btn=>{
    btn.addEventListener('click',async ()=>{
      if(!confirm('Remove this supervisor? Their teachers will be removed too.')) return;
      try { await fbDeleteSupervisor(btn.dataset.rmSchsv); toast('Supervisor removed','success'); }
      catch(e){ console.error(e); toast('Could not remove supervisor','err'); }
    });
  });
  document.querySelectorAll('[data-toggle-pw]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.togglePw; const pw=btn.dataset.pw;
      const el=document.getElementById('sv-pw-'+id);
      if(el.textContent==='••••••••'){el.textContent=pw; btn.textContent='🙈 Hide';}
      else {el.textContent='••••••••'; btn.textContent='👁 Show';}
    });
  });
  document.querySelectorAll('[data-copy-creds]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const c=JSON.parse(btn.dataset.copyCreds);
      navigator.clipboard.writeText(`JMC Classroom Supervisor Login\nUsername: ${c.user}\nPassword: ${c.pass}`).catch(()=>{});
      toast('Copied!','success');
    });
  });
}

function countTcSubmissions(d, tid) {
  let n = 0;
  Object.values(d.classes||{}).forEach(c => {
    (c.work||[]).filter(w=>w.tid===tid).forEach(w => {
      (c.students||[]).forEach(s => {
        const key = `${c.id}_${w.id}_${s.name}`;
        if ((d.submissions||{})[key] && (d.submissions||{})[key].submitted) n++;
      });
    });
  });
  return n;
}

function renderTcMessages(d, tc, myCls) {
  const allStudents = [];
  myCls.forEach(c => (c.students||[]).forEach(s => allStudents.push({...s, clsId:c.id, clsName:c.name})));
  const contactId = APP.msgContactId;
  let thread = [];
  if (contactId) {
    const key = contactId;
    thread = (d.messages||{})[key] || [];
    dbSet(db2 => {
      if (db2.messages[key]) db2.messages[key].forEach(m => { if(m.from==='student') m.readByTeacher=true; });
    });
  }
  const contact = contactId ? allStudents.find(s=>`${s.clsId}_${tc.id}_${s.name}`===contactId) : null;
  return `<div style="display:grid;grid-template-columns:220px 1fr;gap:12px;height:calc(100vh - 110px);max-height:600px">
  <div style="overflow-y:auto">
    <div class="jf" style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">Students</div>
    ${allStudents.length ? allStudents.map(s => {
      const key = `${s.clsId}_${tc.id}_${s.name}`;
      const msgs = (d.messages||{})[key]||[];
      const lastMsg = msgs[msgs.length-1];
      const hasUnread = lastMsg && lastMsg.from==='student' && !lastMsg.readByTeacher;
      const [col,bg] = avc(s.name);
      return `<div class="msg-contact ${key===contactId?'active':''}" onclick="APP.msgContactId='${key}';APP._tcPage='messages';render()">
        <div class="av" style="width:32px;height:32px;font-size:10px;background:${bg};color:${col};flex-shrink:0">${ini(s.name)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;font-weight:${hasUnread?700:500}">${escH(s.name)}</div>
          <div style="font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escH(s.clsName)}</div>
        </div>
        ${hasUnread ? '<div style="width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0"></div>' : ''}
      </div>`;
    }).join('') : '<div style="font-size:12px;color:var(--text3)">No students in your classrooms yet</div>'}
  </div>
  <div style="display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden">
    ${contact ? `
    <div style="padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px">
      <div class="av" style="width:30px;height:30px;font-size:10px;background:${avc(contact.name)[1]};color:${avc(contact.name)[0]}">${ini(contact.name)}</div>
      <div><div class="jf" style="font-size:13px;font-weight:700">${escH(contact.name)}</div><div style="font-size:11px;color:var(--text3)">${escH(contact.clsName)}</div></div>
    </div>
    <div id="tc-thread" style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px">
      ${thread.length ? thread.map(m=>`<div style="display:flex;flex-direction:column;align-items:${m.from==='teacher'?'flex-end':'flex-start'}">
        <div class="msg-bubble ${m.from==='teacher'?'mine':'theirs'}">${escH(m.text)}</div>
        <div class="msg-ts ${m.from==='teacher'?'':'theirs'}" style="font-size:10px;color:var(--text3);margin-top:2px">${m.ts}</div>
      </div>`).join('') : '<div style="text-align:center;color:var(--text3);font-size:12px;margin-top:20px">No messages yet. Start the conversation!</div>'}
    </div>
    <div style="padding:10px;border-top:1px solid var(--border);display:flex;gap:8px">
      <input type="text" id="tc-msg-inp" placeholder="Type a message…" style="flex:1" onkeydown="if(event.key==='Enter')document.getElementById('tc-msg-send').click()">
      <button class="bp" id="tc-msg-send" data-msgkey="${contactId}">Send</button>
    </div>` : `<div class="empty" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center"><div class="empty-ico">💬</div><div>Select a student to view messages</div></div>`}
  </div>
</div>`;
}

function renderTcAttendance(d, tc, cls) {
  const sts = cls.students||[];
  const att = ((cls.attendance||{})[tc.id])||{};
  const today = new Date().toISOString().slice(0,10);
  const date = APP._attDate || today;
  const dayRec = att[date] || {};
  // Seed the in-memory selection buffer from saved data (or carry over unsaved picks for this date)
  if (!_attSel || _attSelDate !== date) { _attSel = {...dayRec}; _attSelDate = date; }
  const dates = Object.keys(att).sort().reverse();
  const statusIcon = {present:'✓',absent:'✕',late:'⏰'};
  const statusCls = {present:'cgreen',absent:'cred',late:'camber'};

  let html = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px">
    <input type="date" id="att-date" value="${date}" max="${today}" style="width:auto">
    <button class="bp bsm" id="att-save">💾 Save attendance</button>
    <span style="font-size:11px;color:var(--text3)">Marking for ${escH((cls.subjects||{})[tc.id]||'General')}</span>
  </div>`;

  if (!sts.length) {
    html += `<div class="empty"><div class="empty-ico">📋</div><div>Add students to this classroom before taking attendance.</div></div>`;
  } else {
    html += sts.map(s => {
      const cur = _attSel[s.name];
      const [col,bg] = avc(s.name);
      return `<div class="st-row" data-att-row="${escH(s.name)}">
        <div class="av" style="width:34px;height:34px;background:${bg};color:${col};font-size:11px">${ini(s.name)}</div>
        <div style="flex:1"><div class="jf" style="font-size:13px;font-weight:600">${escH(s.name)}</div></div>
        <div style="display:flex;gap:5px">
          <button class="att-btn ${cur==='present'?'on-green':''}" data-att-set="${escH(s.name)}" data-status="present" title="Present">✓</button>
          <button class="att-btn ${cur==='late'?'on-amber':''}" data-att-set="${escH(s.name)}" data-status="late" title="Late">⏰</button>
          <button class="att-btn ${cur==='absent'?'on-red':''}" data-att-set="${escH(s.name)}" data-status="absent" title="Absent">✕</button>
        </div>
      </div>`;
    }).join('');
  }

  if (dates.length && sts.length) {
    html += `<div class="jf" style="font-size:13px;font-weight:700;margin:20px 0 10px">Attendance summary</div>
    <div style="overflow-x:auto;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl)">
    <table class="trk-table"><thead><tr><th>Student</th><th>Present</th><th>Late</th><th>Absent</th><th>% Present</th></tr></thead><tbody>`;
    html += sts.map(s => {
      let p=0,l=0,a=0;
      dates.forEach(dt => { const st = att[dt][s.name]; if(st==='present')p++; else if(st==='late')l++; else if(st==='absent')a++; });
      const marked = p+l+a;
      const pct = marked ? Math.round((p+l*0.5)/marked*100) : 0;
      return `<tr><td class="jf" style="font-weight:600;white-space:nowrap">${escH(s.name)}</td><td>${p}</td><td>${l}</td><td>${a}</td><td><span class="mk ${marked?mkCls(pct,100):'mk-ns'}">${marked?pct+'%':'—'}</span></td></tr>`;
    }).join('');
    html += `</tbody></table></div>
    <div style="font-size:10.5px;color:var(--text3);margin-top:8px">${dates.length} day${dates.length!==1?'s':''} recorded · Last: ${new Date(dates[0]).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div>`;
  }
  return html;
}

function renderTcTrack(d, tc, cls) {
  const myWork = (cls.work||[]).filter(w=>w.tid===tc.id);
  const myQuiz = (cls.quiz||[]).filter(q=>q.tid===tc.id);
  const totalQM = myQuiz.reduce((a,q)=>a+(parseInt(q.marks)||1),0);
  const sts = cls.students||[];
  const marks = cls.marks||{};
  const qRes = cls.quizResults||{};
  const subs = d.submissions||{};
  let html = '<div class="jf" style="font-size:14px;font-weight:700;margin-bottom:14px">Student progress &amp; tracking</div>';
  if (myWork.length) {
    html += `<div style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Classwork marks <span style="font-weight:400;color:var(--text3)">(click a mark to edit)</span></div>
    <div style="overflow-x:auto;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:16px">
    <table class="trk-table"><thead><tr><th>Student</th>${myWork.map(w=>`<th>${escH(w.title.length>12?w.title.slice(0,12)+'…':w.title)}<br><span style="font-weight:400">/${w.maxMarks||'?'}</span></th>`).join('')}<th>Submissions</th><th>Avg%</th></tr></thead><tbody>`;
    html += sts.map(s => {
      const wm = myWork.map(w => {
        const mk = (marks[s.name]||{})[w.id];
        const subKey = `${cls.id}_${w.id}_${s.name}`;
        const sub = subs[subKey];
        return {id:w.id, mk, max:w.maxMarks, title:w.title, sub};
      });
      const valid = wm.filter(m=>m.mk!==undefined&&m.max&&!isNaN(parseFloat(m.mk))&&!isNaN(parseFloat(m.max)));
      const avg = valid.length ? Math.round(valid.reduce((a,m)=>a+parseFloat(m.mk)/parseFloat(m.max)*100,0)/valid.length) : '—';
      const subCount = wm.filter(m=>m.sub&&m.sub.submitted).length;
      return `<tr><td class="jf" style="font-weight:600;white-space:nowrap">${escH(s.name)}</td>
      ${wm.map(m=>`<td><span class="mk ${mkCls(m.mk,m.max)}" data-open-mark="${escH(s.name)}__${m.id}__${escH(m.title)}__${m.max||''}__${m.mk||''}" data-cls="${cls.id}">${m.mk!==undefined&&m.mk!==''?m.mk:'—'}</span></td>`).join('')}
      <td><span class="bdg ${subCount>0?'cgreen':'cgray'}">${subCount}/${myWork.length}</span></td>
      <td><span class="mk ${avg!=='—'?mkCls(avg,100):'mk-ns'}">${avg!=='—'?avg+'%':avg}</span></td></tr>`;
    }).join('');
    html += `</tbody></table></div>`;
  }
  if (myWork.length) {
    html += `<div class="jf" style="font-size:13px;font-weight:700;margin-bottom:10px">Student Submissions</div>`;
    myWork.forEach(w => {
      const wSubs = sts.map(s=>({...s, sub:(subs[`${cls.id}_${w.id}_${s.name}`]||{})})).filter(s=>s.sub&&s.sub.submitted);
      html += `<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px">📝 ${escH(w.title)} <span class="bdg cgray">${wSubs.length} submitted</span></div>
      ${wSubs.length ? wSubs.map(s=>`<div class="sub-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div style="font-size:13px;font-weight:600">${escH(s.name)}</div>
          <div style="font-size:11px;color:var(--text3)">${s.sub.ts||''}</div>
        </div>
        <div style="font-size:13px;color:var(--text2);line-height:1.65;background:var(--bg4);border-radius:var(--r);padding:10px;border:1px solid var(--border);white-space:pre-wrap">${escH(s.sub.text||'(no content)')}</div>
      </div>`).join('') : '<div style="font-size:12px;color:var(--text3);padding:6px 0">No submissions yet</div>'}`;
    });
  }
  if (myQuiz.length) {
    html += `<div class="jf" style="font-size:13px;font-weight:700;margin:14px 0 10px">Quiz results</div>
    <div style="overflow-x:auto;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl)">
    <table class="trk-table"><thead><tr><th>Student</th><th>Subject</th><th>Correct</th><th>Marks</th><th>%</th><th>Date</th></tr></thead><tbody>`;
    const mySubj = (cls.subjects||{})[tc.id]||'General';
    html += sts.map(s => {
      const res = ((qRes[s.name]||{})[mySubj]);
      if (res) {
        const pct = totalQM ? Math.round(res.marks/totalQM*100) : 0;
        return `<tr><td class="jf" style="font-weight:600">${escH(s.name)}</td><td>${mySubj}</td><td>${res.correct}/${myQuiz.length}</td>
        <td><span class="mk ${mkCls(res.marks,totalQM)}">${res.marks}</span></td>
        <td><span class="mk ${mkCls(pct,100)}">${pct}%</span></td>
        <td style="font-size:11px;color:var(--text3)">${res.date}</td></tr>`;
      }
      return `<tr><td class="jf" style="font-weight:600">${escH(s.name)}</td><td>${mySubj}</td><td colspan="3" style="color:var(--text3)">Not attempted</td><td style="color:var(--text3)">—</td></tr>`;
    }).join('');
    html += `</tbody></table></div>`;
  }
  if (!myWork.length && !myQuiz.length) html += `<div class="empty"><div class="empty-ico">📊</div><div>Add classwork or quiz questions to track student progress.</div></div>`;
  return html;
}

function renderTcClsMessages(d, tc, cls) {
  const sts = cls.students||[];
  const contactId = APP.msgContactId;
  let thread = [];
  if (contactId) {
    thread = (d.messages||{})[contactId]||[];
    dbSet(db2 => { if(db2.messages[contactId]) db2.messages[contactId].forEach(m=>{ if(m.from==='student') m.readByTeacher=true; }); });
  }
  const contact = contactId ? sts.find(s=>`${cls.id}_${tc.id}_${s.name}`===contactId) : null;
  return `<div style="display:grid;grid-template-columns:180px 1fr;gap:10px;height:400px">
  <div style="overflow-y:auto">
    ${sts.length ? sts.map(s => {
      const key = `${cls.id}_${tc.id}_${s.name}`;
      const msgs = (d.messages||{})[key]||[];
      const lastMsg = msgs[msgs.length-1];
      const hasUnread = lastMsg && lastMsg.from==='student' && !lastMsg.readByTeacher;
      const [col,bg] = avc(s.name);
      return `<div class="msg-contact ${key===contactId?'active':''}" onclick="APP.msgContactId='${key}';APP._tcTab=7;APP._tcPage='cls_${cls.id}';render()">
        <div class="av" style="width:28px;height:28px;font-size:9px;background:${bg};color:${col};flex-shrink:0">${ini(s.name)}</div>
        <div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:${hasUnread?700:500}">${escH(s.name)}</div></div>
        ${hasUnread ? '<div style="width:7px;height:7px;border-radius:50%;background:var(--blue)"></div>' : ''}
      </div>`;
    }).join('') : '<div style="font-size:12px;color:var(--text3)">No students yet</div>'}
  </div>
  <div style="display:flex;flex-direction:column;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden">
    ${contact ? `
    <div style="padding:10px 12px;border-bottom:1px solid var(--border)"><div class="jf" style="font-size:13px;font-weight:700">${escH(contact.name)}</div></div>
    <div id="tc-thread" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:7px">
      ${thread.map(m=>`<div style="display:flex;flex-direction:column;align-items:${m.from==='teacher'?'flex-end':'flex-start'}">
        <div class="msg-bubble ${m.from==='teacher'?'mine':'theirs'}">${escH(m.text)}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:2px">${m.ts}</div>
      </div>`).join('')||'<div style="text-align:center;color:var(--text3);font-size:12px;margin-top:16px">No messages yet</div>'}
    </div>
    <div style="padding:8px;border-top:1px solid var(--border);display:flex;gap:6px">
      <input type="text" id="tc-msg-inp" placeholder="Type a message…" style="flex:1;font-size:12px" onkeydown="if(event.key==='Enter')document.getElementById('tc-msg-send').click()">
      <button class="bp bsm" id="tc-msg-send" data-msgkey="${contactId}">Send</button>
    </div>` : `<div class="empty" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center"><div class="empty-ico">💬</div><div>Select a student</div></div>`}
  </div>
</div>`;
}

// ── STUDENT SHELL ─────────────────────────────
function renderStudent() {
  const d = db();
  const st = APP.user; // {name, classId}
  const cls = d.classes[st.classId];
  if (!cls) return `<div class="land-wrap"><div class="land-card"><div class="jf" style="font-size:16px;font-weight:700;margin-bottom:12px">Classroom not found</div><button class="bp" data-go="land">Back to home</button></div></div>`;
  const pg = APP._stPage || 'classroom';
  const subj = APP.curStSubj || 'All';
  const unread = countStUnread(d, st, cls);
  const [col,bg] = avc(st.name);
  const tcs = (cls.teachers||[]).map(tid=>STATE.teachers[tid]).filter(Boolean);
  const navItems = [
    {id:'classroom', icon:'🏫', label:'Classroom'},
    {id:'workspace', icon:'✏️', label:'My Work'},
    {id:'messages', icon:'💬', label:'Messages', badge: unread},
    {id:'courses', icon:'📚', label:'Free Courses'},
  ];
  return shellTemplate({
    logo: jmcLogo(32,'#1f6feb','#7c3aed','lst'),
    title: 'JMC Classroom', subtitle: escH(cls.div||'Student'),
    navItems, activePage: pg, navPrefix: 'st',
    topTitle: {classroom:escH(cls.name), workspace:'My Work', messages:'Messages', courses:'Free Courses'}[pg]||'Classroom',
    content: pg==='classroom' ? renderStClassroom(d, st, cls, subj) :
             pg==='workspace' ? renderStWorkspace(d, st, cls) :
             pg==='messages'  ? renderStMessages(d, st, cls, tcs) :
             pg==='courses'   ? renderStCourses() : renderStClassroom(d, st, cls, subj),
    footerAvStyle:`width:28px;height:28px;font-size:10px;background:${bg};color:${col}`,
    footerAvText: ini(st.name),
    footerName: st.name, footerSub: 'Leave & sign out', signoutGo: 'land',
    modals: '',
  });
}

function countStUnread(d, st, cls) {
  let n = 0;
  (cls.teachers||[]).forEach(tid => {
    const key = `${cls.id}_${tid}_${st.name}`;
    const msgs = (d.messages||{})[key]||[];
    const last = msgs[msgs.length-1];
    if (last && last.from==='teacher' && !last.readByStudent) n++;
  });
  return n;
}

function renderStClassroom(d, st, cls, subj) {
  const tcs = (cls.teachers||[]).map(tid=>STATE.teachers[tid]).filter(Boolean);
  const allSubjs = ['All',...new Set(Object.values(cls.subjects||{}))];
  const posts = subj==='All' ? (cls.posts||[]) : (cls.posts||[]).filter(p=>p.subj===subj);
  const work = subj==='All' ? (cls.work||[]) : (cls.work||[]).filter(w=>w.subj===subj);
  const mats = subj==='All' ? (cls.materials||[]) : (cls.materials||[]).filter(m=>m.subj===subj);
  const quiz = subj==='All' ? (cls.quiz||[]) : (cls.quiz||[]).filter(q=>q.subj===subj);
  let html = `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px">
    <span class="bdg cblue">${escH(cls.div)}</span>
    <span class="bdg cgray">${(cls.students||[]).length} students</span>
    ${tcs.length ? `<span class="bdg cteal">👥 ${tcs.map(t=>escH(t.name)).join(', ')}</span>` : ''}
  </div>
  <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px">
    ${allSubjs.map(s=>`<span class="spill ${s===subj?'on':''}" onclick="APP.curStSubj='${s}';APP._stPage='classroom';render()">${s}</span>`).join('')}
  </div>`;
  // Attendance summary for this student, scoped to the currently selected subject's teacher(s)
  {
    const relevantTids = subj==='All' ? Object.keys(cls.subjects||{}) : Object.keys(cls.subjects||{}).filter(tid=>(cls.subjects||{})[tid]===subj);
    let p=0,l=0,a=0;
    relevantTids.forEach(tid=>{
      const byDate = ((cls.attendance||{})[tid])||{};
      Object.keys(byDate).forEach(dt=>{ const status=byDate[dt][st.name]; if(status==='present')p++; else if(status==='late')l++; else if(status==='absent')a++; });
    });
    const marked = p+l+a;
    const pct = marked ? Math.round((p+l*0.5)/marked*100) : null;
    if (marked) {
      html += `<div class="card" style="margin-bottom:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        <div style="text-align:center;min-width:70px"><div class="jf" style="font-size:26px;font-weight:800;color:${pct>=90?'var(--green)':pct>=75?'var(--amber)':'var(--red)'}">${pct}%</div><div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px">Attendance</div></div>
        <div style="display:flex;gap:14px;font-size:12px;color:var(--text2)">
          <span><b style="color:var(--green)">${p}</b> present</span>
          <span><b style="color:var(--amber)">${l}</b> late</span>
          <span><b style="color:var(--red)">${a}</b> absent</span>
          <span style="color:var(--text3)">· ${marked} day${marked!==1?'s':''} recorded</span>
        </div>
      </div>`;
    }
  }
  if (mats.length) {
    html += `<div class="jf" style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">📚 Materials</div>`;
    html += mats.map(m=>`<div class="mat-card" style="margin-bottom:7px">
      <div style="width:36px;height:36px;border-radius:9px;background:var(--teal-bg);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">${ATT_I[m.mtype]||'📎'}</div>
      <div style="flex:1;min-width:0"><div class="jf" style="font-size:13px;font-weight:600">${escH(m.title)}</div>
      ${m.desc?`<div style="font-size:12px;color:var(--text2);margin-top:1px">${escH(m.desc)}</div>`:''}
      <div style="font-size:11px;color:var(--text3);margin-top:2px">${escH(m.subj)} · ${m.date}</div></div>
      ${m.att?(m.att.startsWith('http')?`<a href="${escH(m.att)}" target="_blank" class="bp bsm" style="text-decoration:none;white-space:nowrap">Open ↗</a>`:`<span class="bdg cgray">${escH(m.att)}</span>`):''}
    </div>`).join('');
    html += `<div class="sep"></div>`;
  }
  if (posts.length) {
    html += `<div class="jf" style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">Posts</div>`;
    html += posts.slice().reverse().map(p => {
      const t = STATE.teachers[p.tid];
      return `<div class="post-card">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <div class="av" style="width:28px;height:28px;background:var(--blue-bg);color:var(--blue);font-size:9px">${t?ini(t.name):'TC'}</div>
          <div style="flex:1"><div class="jf" style="font-size:13px;font-weight:600">${t?escH(t.name):'Teacher'}</div><div style="font-size:11px;color:var(--text3)">${p.subj} · ${p.date}</div></div>
          <span class="bdg ${SUBJ_C[p.subj]||'cgray'}">${p.subj}</span>
        </div>
        <div class="jf" style="font-size:14px;font-weight:700;margin-bottom:5px">${escH(p.title)}</div>
        <div class="post-body-txt">${escH(p.body).replace(/\n/g,'<br>')}</div>
        ${p.att?`<div style="display:flex;align-items:center;gap:7px;margin-top:8px;padding:8px 11px;background:var(--bg3);border-radius:var(--r);border:1px solid var(--border);font-size:12px;color:var(--text2)">${ATT_I[p.attType]||'📎'} ${p.att.startsWith('http')?`<a href="${escH(p.att)}" target="_blank" style="color:var(--blue)">Open attachment ↗</a>`:escH(p.att)}</div>`:''}
      </div>`;
    }).join('');
  }
  if (work.length) {
    html += `<div class="jf" style="font-size:11px;font-weight:700;color:var(--text2);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.5px">Classwork</div>`;
    html += work.map(w => {
      const subKey = `${cls.id}_${w.id}_${st.name}`;
      const sub = (d.submissions||{})[subKey];
      return `<div class="work-item">
        <div class="work-ico" style="background:var(--amber-bg);color:var(--amber)">${ATT_I[w.wtype]||'📋'}</div>
        <div style="flex:1;min-width:0">
          <div class="jf" style="font-size:13px;font-weight:600">${escH(w.title)}</div>
          <div style="font-size:11px;color:var(--text3)">Due: ${escH(w.due||'No due date')} · ${escH(w.subj)}${w.maxMarks?' · Max: '+escH(w.maxMarks)+' marks':''}</div>
          ${w.inst?`<div style="font-size:12px;color:var(--text2);margin-top:2px">${escH(w.inst)}</div>`:''}
        </div>
        ${sub && sub.submitted ? `<span class="bdg cgreen">✓ Submitted</span>` : `<button class="bp bsm" onclick="APP._stPage='workspace';APP._wsWorkId='${w.id}';render()">Open workspace</button>`}
      </div>`;
    }).join('');
  }
  if (quiz.length) {
    html += `<div class="jf" style="font-size:11px;font-weight:700;color:var(--text2);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.5px">Quiz</div>`;
    const subjGroups = [...new Set(quiz.map(q=>q.subj))];
    subjGroups.forEach(sq => {
      const sqQ = quiz.filter(q=>q.subj===sq);
      const already = ((db().classes[cls.id].quizResults||{})[st.name]||{})[sq];
      const totalM = sqQ.reduce((a,q)=>a+(parseInt(q.marks)||1),0);
      const key = sq.replace(/\W/g,'_');
      if (already) {
        const pct = totalM ? Math.round(already.marks/totalM*100) : 0;
        html += `<div class="card" style="text-align:center;padding:20px;margin-bottom:10px">
          <div class="jf" style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px">${sq} Quiz</div>
          <div class="jf" style="font-size:36px;font-weight:700;color:${pct>=70?'var(--green)':pct>=40?'var(--amber)':'var(--red)'}">${already.marks}/${totalM}</div>
          <div style="font-size:13px;color:var(--text2);margin-top:4px">${pct}% · ${already.correct}/${sqQ.length} correct</div>
        </div>`;
      } else {
        if (!APP.quizState[key]) APP.quizState[key] = {qs:sqQ,cur:0,score:0,marks:0,done:false,answered:false,subj:sq,clsId:cls.id};
        html += `<div id="quiz-block-${key}" class="card" style="margin-bottom:10px"></div>`;
      }
    });
  }
  if (!mats.length && !posts.length && !work.length && !quiz.length) html += `<div class="empty"><div class="empty-ico">📚</div><div>Nothing posted yet for this subject.</div></div>`;
  return html;
}

function renderStWorkspace(d, st, cls) {
  const work = cls.work||[];
  const wsWorkId = APP._wsWorkId;
  const subs = d.submissions||{};
  if (wsWorkId) {
    const w = work.find(x=>x.id===wsWorkId);
    if (!w) return `<div class="empty"><div>Assignment not found</div></div>`;
    const subKey = `${cls.id}_${w.id}_${st.name}`;
    const sub = subs[subKey]||{};
    const isSubmitted = sub.submitted;
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <button class="bgh bsm" onclick="APP._stPage='workspace';APP._wsWorkId=null;render()">← All assignments</button>
      <div class="jf" style="font-size:15px;font-weight:700;flex:1">${escH(w.title)}</div>
      ${isSubmitted ? '<span class="bdg cgreen">✓ Submitted</span>' : ''}
    </div>
    <div class="card" style="margin-bottom:12px">
      <div class="jf" style="font-size:13px;font-weight:700;margin-bottom:6px">📋 Assignment details</div>
      <div style="font-size:13px;color:var(--text2);line-height:1.65">${w.inst ? escH(w.inst) : 'Complete the assigned work below.'}</div>
      ${w.maxMarks ? `<div style="margin-top:8px"><span class="bdg camber">Max: ${escH(w.maxMarks)} marks</span> <span class="bdg cgray">Due: ${escH(w.due||'No due date')}</span></div>` : ''}
    </div>
    ${isSubmitted ? `<div class="info-box">✓ You submitted this assignment on ${sub.ts}. Your teacher can view your work.</div>
    <div style="background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rl);min-height:180px;padding:14px;color:var(--text);font-size:14px;line-height:1.8;white-space:pre-wrap">${escH(sub.text||'')}</div>
    <div class="frow"><button class="bdng" id="ws-reopen" data-cls="${cls.id}" data-wid="${w.id}" data-sname="${escH(st.name)}">Edit &amp; resubmit</button></div>` :
    `<div class="jf" style="font-size:13px;font-weight:700;margin-bottom:8px">Your work</div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:6px">Auto-saved as you type. Submit when ready for your teacher to review.</div>
    <div class="ws-bar">
      <button class="ws-btn" onclick="execCmd('bold')"><b>B</b></button>
      <button class="ws-btn" onclick="execCmd('italic')"><i>I</i></button>
      <button class="ws-btn" onclick="execCmd('underline')"><u>U</u></button>
      <button class="ws-btn" onclick="execCmd('insertUnorderedList')">• List</button>
      <button class="ws-btn" onclick="execCmd('insertOrderedList')">1. List</button>
    </div>
    <div class="ws-editor" id="ws-editor" contenteditable="true" data-ph="Start typing your answer here… Your work is saved automatically as you type."
      oninput="wsAutosave('${cls.id}','${w.id}','${escH(st.name)}')">${sub.text ? escH(sub.text).replace(/\n/g,'<br>') : ''}</div>
    <div class="frow">
      <button class="bp" id="ws-submit" data-cls="${cls.id}" data-wid="${w.id}" data-sname="${escH(st.name)}" style="flex:1;padding:10px">Submit assignment ↗</button>
      <button class="bs2" onclick="APP._stPage='workspace';APP._wsWorkId=null;render()">Save &amp; back</button>
    </div>
    <div id="ws-status" style="font-size:11px;color:var(--text3);margin-top:6px"></div>`}`;
  }
  return `<div class="jf" style="font-size:18px;font-weight:700;margin-bottom:14px">My Work</div>
  <div class="info-box">Click an assignment to open your workspace and write your answer. Your work auto-saves and you can submit when ready.</div>
  ${work.length ? work.map(w => {
    const subKey = `${cls.id}_${w.id}_${st.name}`;
    const sub = subs[subKey]||{};
    const isSubmitted = sub.submitted;
    const hasDraft = sub.text && !isSubmitted;
    return `<div class="work-item" style="cursor:pointer" onclick="APP._stPage='workspace';APP._wsWorkId='${w.id}';render()">
      <div class="work-ico" style="background:var(--amber-bg);color:var(--amber)">${ATT_I[w.wtype]||'📋'}</div>
      <div style="flex:1;min-width:0">
        <div class="jf" style="font-size:13px;font-weight:600">${escH(w.title)}</div>
        <div style="font-size:11px;color:var(--text3)">Due: ${escH(w.due||'No due date')} · ${escH(w.subj)}${w.maxMarks?' · Max: '+escH(w.maxMarks)+' marks':''}</div>
      </div>
      ${isSubmitted ? '<span class="bdg cgreen">✓ Submitted</span>' : hasDraft ? '<span class="bdg camber">Draft saved</span>' : '<span class="bdg cgray">Not started</span>'}
    </div>`;
  }).join('') : `<div class="empty"><div class="empty-ico">✏️</div><div>No assignments yet. Your teacher will post work here.</div></div>`}`;
}

function renderStMessages(d, st, cls, tcs) {
  const contactId = APP.msgContactId;

  if (contactId) {
    thread = (d.messages||{})[contactId]||[];
    dbSet(db2 => { if(db2.messages[contactId]) db2.messages[contactId].forEach(m=>{ if(m.from==='teacher') m.readByStudent=true; }); });
  }
  const contactTc = contactId ? tcs.find(t=>`${cls.id}_${t.id}_${st.name}`===contactId) : null;
  return `<div style="display:grid;grid-template-columns:180px 1fr;gap:12px;height:calc(100vh - 110px);max-height:560px">
  <div style="overflow-y:auto">
    <div class="jf" style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">Teachers</div>
    ${tcs.length ? tcs.map(t => {
      const key = `${cls.id}_${t.id}_${st.name}`;
      const msgs = (d.messages||{})[key]||[];
      const last = msgs[msgs.length-1];
      const hasUnread = last && last.from==='teacher' && !last.readByStudent;
      const [col,bg] = avc(t.name);
      return `<div class="msg-contact ${key===contactId?'active':''}" onclick="APP.msgContactId='${key}';APP._stPage='messages';render()">
        <div class="av" style="width:28px;height:28px;font-size:9px;background:${bg};color:${col};flex-shrink:0">${ini(t.name)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;font-weight:${hasUnread?700:500}">${escH(t.name)}</div>
          <div style="font-size:10px;color:var(--text3)">${(cls.subjects||{})[t.id]||'General'}</div>
        </div>
        ${hasUnread ? '<div style="width:7px;height:7px;border-radius:50%;background:var(--blue)"></div>' : ''}
      </div>`;
    }).join('') : '<div style="font-size:12px;color:var(--text3)">No teachers yet</div>'}
  </div>
  <div style="display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden">
    ${contactTc ? `
    <div style="padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px">
      <div class="av" style="width:28px;height:28px;font-size:9px;background:${avc(contactTc.name)[1]};color:${avc(contactTc.name)[0]}">${ini(contactTc.name)}</div>
      <div><div class="jf" style="font-size:13px;font-weight:700">${escH(contactTc.name)}</div>
      <div style="font-size:11px;color:var(--text3)">${(cls.subjects||{})[contactTc.id]||'General'}</div></div>
    </div>
    <div id="st-thread" style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px">
      ${thread.map(m=>`<div style="display:flex;flex-direction:column;align-items:${m.from==='student'?'flex-end':'flex-start'}">
        <div class="msg-bubble ${m.from==='student'?'mine':'theirs'}">${escH(m.text)}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:2px;${m.from==='student'?'text-align:right':'text-align:left'}">${m.ts}</div>
      </div>`).join('')||'<div style="text-align:center;color:var(--text3);font-size:12px;margin-top:20px">Send your teacher a message!</div>'}
    </div>
    <div style="padding:10px;border-top:1px solid var(--border);display:flex;gap:8px">
      <input type="text" id="st-msg-inp" placeholder="Type a message to your teacher…" style="flex:1" onkeydown="if(event.key==='Enter')document.getElementById('st-msg-send').click()">
      <button class="bp" id="st-msg-send" data-msgkey="${contactId}" data-stname="${escH(st.name)}">Send</button>
    </div>` : `<div class="empty" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center"><div class="empty-ico">💬</div><div>Select a teacher to send a message</div></div>`}
  </div>
</div>`;
}

function setBtnBusy(btn, busy, busyLabel) {
  if (!btn) return;
  if (busy) { btn.dataset._label = btn.textContent; btn.textContent = busyLabel || 'Please wait…'; btn.disabled = true; btn.style.opacity = '.65'; }
  else { btn.textContent = btn.dataset._label || btn.textContent; btn.disabled = false; btn.style.opacity = ''; }
}

// Every staff login screen shares one flow: sign in with Google, resolve
// the role from Firestore, land on whichever dashboard actually matches —
// which may not be the tile they clicked, if e.g. they meant to use a
// different Google account.
const ROLE_SCREENS = {
  operator:   { screen:'operator',   pageVar:'_opPage',     defaultPage:'dash' },
  school:     { screen:'school',     pageVar:'_schoolPage', defaultPage:'dash' },
  supervisor: { screen:'supervisor', pageVar:'_svPage',     defaultPage:'dash' },
  teacher:    { screen:'teacher',    pageVar:'_tcPage',     defaultPage:'home' },
  student:    { screen:'st-hub',     pageVar:'_stPage',     defaultPage:'classroom' },
};
function attachGoogleLoginScreen(idPrefix, expectedRole) {
  const submit = document.getElementById(idPrefix+'-submit');
  if (!submit) return;
  submit.addEventListener('click', async () => {
    const errEl = document.getElementById(idPrefix+'-err');
    const emEl = document.getElementById(idPrefix+'-em');
    errEl.style.display = 'none';
    if (!FB_READY) { emEl.textContent = "Firebase isn't configured yet — see setup notes."; errEl.style.display='flex'; return; }
    setBtnBusy(submit, true, 'Signing in…');
    try {
      const user = await googleSignInFlow();
      const target = ROLE_SCREENS[user.role];
      APP.user = user;
      APP[target.pageVar] = APP[target.pageVar] || target.defaultPage;
      APP.screen = target.screen;
      if (user.role !== expectedRole) toast(`This account isn't registered as ${expectedRole} — signed in as ${user.role} instead.`);
      await loadOrgIntoState();
      render();
    } catch (e) {
      setBtnBusy(submit, false);
      console.error(e);
      emEl.textContent = e.code === 'auth/popup-closed-by-user' ? 'Sign-in window closed before finishing.'
        : ['SCHOOL_NOT_FOUND','SUPERVISOR_NOT_FOUND','TEACHER_NOT_FOUND'].includes(e.message) ? 'This account is registered but the linked record is missing — contact whoever set it up.'
        : 'Could not sign in — check your connection and try again.';
      errEl.style.display = 'flex';
    }
  });
}
function attachOpLogin() { attachGoogleLoginScreen('op', 'operator'); }
function attachSchoolLogin() { attachGoogleLoginScreen('sc', 'school'); }
function attachSvLogin() { attachGoogleLoginScreen('sv', 'supervisor'); }
function attachTcLogin() { attachGoogleLoginScreen('tc', 'teacher'); }

  document.getElementById('hub-courses-btn')?.addEventListener('click',()=>{
    APP.screen='courses'; APP._coursePage='home'; render();
  });

function attachStJoin() {
  document.getElementById('sj-submit')?.addEventListener('click',()=>{
    const name = document.getElementById('sj-name').value.trim();
    const code = document.getElementById('sj-code').value.trim().toUpperCase();
    const em = document.getElementById('sj-em'); const e = document.getElementById('sj-err');
    e.style.display='none';
    if (!name) { em.textContent='Enter your name'; e.style.display='flex'; return; }
    if (code.length!==6) { em.textContent='Enter a valid 6-letter code'; e.style.display='flex'; return; }
    const d = db();
    const cls = Object.values(d.classes||{}).find(c=>c.code===code);
    if (!cls) { em.textContent='Classroom not found. Check your code.'; e.style.display='flex'; return; }
    let existing = (cls.students||[]).find(s=>s.name.toLowerCase()===name.toLowerCase());
    if (!existing) {
      dbSet(db2 => {
        if(!db2.classes[cls.id].students) db2.classes[cls.id].students=[];
        db2.classes[cls.id].students.push({name, joined:fdt()});
      });
    }
    APP._studentName = name;
    APP.screen='student'; APP.user={name, classId:cls.id, role:'student'}; APP.quizState={}; render();
  });
}

      dbSet(db2=>{if(!db2.classes[cid].teachers.includes(tid)){db2.classes[cid].teachers.push(tid);db2.classes[cid].subjects[tid]=t.subjects&&t.subjects.length?t.subjects[0]:'General';}});

let _markCtx = null;
function attachTeacher() {
  document.querySelectorAll('[data-code]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const code=btn.dataset.code; const cn=btn.dataset.clsname||'';
      navigator.clipboard.writeText(`Join ${cn}!\nCode: ${code}\nGo to JMC Classroom → Student → Join a Classroom → enter this code.`).catch(()=>{});
      toast('Code copied!','success');
    });
  });
  document.getElementById('att-date')?.addEventListener('change',(e)=>{
    APP._attDate = e.target.value;
    _attSel = null; // force reload from saved data for the new date
    render();
  });
  document.querySelectorAll('[data-att-set]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const name = btn.dataset.attSet, status = btn.dataset.status;
      _attSel[name] = (_attSel[name] === status) ? undefined : status; // click again to un-mark
      const row = document.querySelector(`[data-att-row="${CSS.escape(name)}"]`);
      if (row) row.querySelectorAll('.att-btn').forEach(b=>{
        b.classList.remove('on-green','on-amber','on-red');
        if (_attSel[name] === b.dataset.status) {
          b.classList.add(b.dataset.status==='present'?'on-green':b.dataset.status==='late'?'on-amber':'on-red');
        }
      });
    });
  });
  document.getElementById('att-save')?.addEventListener('click',()=>{
    const cid = APP._tcPage.replace('cls_','');
    const date = APP._attDate || new Date().toISOString().slice(0,10);
    const clean = {}; Object.keys(_attSel||{}).forEach(k=>{ if(_attSel[k]) clean[k]=_attSel[k]; });
    dbSet(d=>{
      const cls = d.classes[cid]; if(!cls) return;
      if(!cls.attendance) cls.attendance={};
      if(!cls.attendance[APP.user.id]) cls.attendance[APP.user.id]={};

    });
