<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard | JMC Innovators</title>
<meta name="description" content="Your personalised JMC Innovators learning dashboard.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app-shell.css">
<style>
  .welcome-banner{
    display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
    padding:26px 28px; border-radius:var(--r-xl); margin-bottom:22px; position:relative; overflow:hidden;
    background:linear-gradient(120deg, rgba(99,102,241,.16), rgba(242,167,27,.08) 60%, rgba(20,184,166,.08));
    border:1px solid var(--border);
  }
  .welcome-banner h2{font-size:23px; margin-bottom:4px;}
  .welcome-banner p{color:var(--text-2); font-size:13.6px; margin:0;}
  .stat-card{padding:18px; display:flex; flex-direction:column; gap:6px;}
  .stat-card .stat-icon{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; margin-bottom:4px;}
  .stat-card .stat-num{font-family:'Sora',sans-serif; font-weight:800; font-size:22px;}
  .stat-card .stat-label{font-size:11.8px; color:var(--text-2); font-weight:600;}
  .section-title{font-size:15.5px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between;}
  .subject-row{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .subject-row:last-child{margin-bottom:0;}
  .subject-row .subject-name{width:110px; font-size:12.8px; font-weight:700; flex-shrink:0;}
  .subject-row .subject-pct{width:38px; text-align:right; font-size:12px; color:var(--text-2); flex-shrink:0;}
  .activity-item{display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--border-soft);}
  .activity-item:last-child{border-bottom:none;}
  .activity-dot{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px;}
  .activity-text{font-size:12.8px; font-weight:700;}
  .activity-time{font-size:11px; color:var(--text-3); margin-top:1px;}
  .quick-links{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  @media (max-width:760px){ .quick-links{grid-template-columns:repeat(2,1fr);} }
  .quick-link-card{padding:16px; text-align:center; transition:.25s var(--ease-out);}
  .quick-link-card:hover{transform:translateY(-3px); border-color:rgba(99,102,241,.4);}
  .quick-link-card .ql-emoji{font-size:24px; margin-bottom:8px;}
  .quick-link-card .ql-name{font-size:12.6px; font-weight:700;}
  .ai-promo{display:flex; flex-direction:column; gap:12px; padding:20px; background:linear-gradient(150deg, rgba(139,92,246,.16), rgba(59,130,246,.08));}
  .child-mini-card{display:flex; align-items:center; gap:12px; padding:14px; border-radius:var(--r-md); background:var(--panel-2); border:1px solid var(--border); margin-bottom:10px;}
  .child-mini-card:last-child{margin-bottom:0;}
</style>
</head>
<body class="app-body">

<div id="appShellRoot"></div>

<script type="module" src="/js/dashboard.page.js"></script>
<script src="/js/register-sw.js"></script>
</body>
</html>
