<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Page Not Found | JMC Innovators Learning Platform</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#05070f">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg-0:#05070f; --text-0:#f3f5fb; --text-2:#8891ac;
  --gold:#f2a71b; --gold-2:#ffcf6b; --blue-2:#6366f1; --purple:#8b5cf6;
  --border:rgba(148,163,196,0.14);
  --ease-elastic:cubic-bezier(.34,1.56,.64,1);
}
html{scroll-behavior:smooth;}
body{background:var(--bg-0);color:var(--text-0);font-family:'Manrope',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:24px;}
h1,h2{font-family:'Sora',sans-serif;}
a{color:inherit;text-decoration:none;}

.bg-field{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(1100px 700px at 82% -8%, rgba(99,102,241,0.28), transparent 60%),
    radial-gradient(900px 600px at -5% 15%, rgba(242,167,27,0.14), transparent 60%),
    linear-gradient(180deg,#05070f 0%, #070a15 40%, #05070f 100%);}
.bg-blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.45;}
.bg-blob.b1{width:460px;height:460px;top:-110px;right:-100px;background:radial-gradient(circle, rgba(139,92,246,.5), transparent 70%);animation:drift1 24s ease-in-out infinite;}
.bg-blob.b2{width:420px;height:420px;bottom:-110px;left:-100px;background:radial-gradient(circle, rgba(242,167,27,.35), transparent 70%);animation:drift2 28s ease-in-out infinite;}
@keyframes drift1{0%,100%{transform:translate(0,0);}50%{transform:translate(-30px,25px);}}
@keyframes drift2{0%,100%{transform:translate(0,0);}50%{transform:translate(25px,-25px);}}

.card{position:relative;z-index:2;max-width:520px;width:100%;text-align:center;background:rgba(14,20,36,0.75);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--border);border-radius:26px;padding:48px 36px;box-shadow:0 30px 70px -24px rgba(0,0,0,.7);}
.code{font-size:88px;font-weight:800;line-height:1;background:linear-gradient(135deg,var(--gold-2),var(--gold),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;}
.card h2{font-size:22px;margin:10px 0 12px;}
.card p{color:var(--text-2);font-size:14.5px;line-height:1.6;margin-bottom:28px;}

.btn-home{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;gap:9px;padding:15px 28px;border-radius:999px;font-weight:800;font-size:14.5px;color:#fff;background:linear-gradient(135deg,var(--blue-2),var(--purple) 55%,var(--gold) 130%);border:1px solid rgba(255,255,255,.25);box-shadow:0 16px 36px -14px rgba(99,102,241,.6);transition:transform .3s var(--ease-elastic), box-shadow .3s ease;}
.btn-home::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-130%) skewX(-15deg);transition:transform .7s ease-out;}
.btn-home:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 22px 46px -14px rgba(139,92,246,.7);}
.btn-home:hover::before{transform:translateX(130%) skewX(-15deg);}
.btn-home:active{transform:translateY(-1px) scale(.97);}
.ripple-el{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rippleAnim .6s cubic-bezier(.16,1,.3,1);pointer-events:none;}
@keyframes rippleAnim{to{transform:scale(1);opacity:0;}}
</style>
</head>
<body>

<div class="bg-field"><div class="bg-blob b1"></div><div class="bg-blob b2"></div></div>

<div class="card">
  <div class="code">404</div>
  <h2>Lost your way?</h2>
  <p>The page you're looking for doesn't exist or may have moved. Let's get you back to learning.</p>
  <a href="/index.html" class="btn-home">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11.5L12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    <span>Back to Home</span>
  </a>
</div>

<script>
document.addEventListener('pointerdown', function(e){
  var el = e.target.closest('.btn-home');
  if(!el) return;
  var rect = el.getBoundingClientRect();
  var size = Math.max(rect.width, rect.height) * 1.8;
  var span = document.createElement('span');
  span.className = 'ripple-el';
  span.style.width = span.style.height = size + 'px';
  span.style.left = (e.clientX - rect.left - size/2) + 'px';
  span.style.top = (e.clientY - rect.top - size/2) + 'px';
  el.style.position = 'relative';
  el.style.overflow = 'hidden';
  el.appendChild(span);
  span.addEventListener('animationend', function(){ span.remove(); });
});
</script>
</body>
</html>
