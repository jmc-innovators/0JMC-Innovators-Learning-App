:root{
  --accent: #4CAF50;

body {

  background-attachment: fixed;
  margin: 0;

/* Navbar */
.navbar {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 10px;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(6px);
}

.navbar button {
  font-family: 'Orbitron', sans-serif;
  background: var(--accent);
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

.navbar button:hover {
  box-shadow: 0 0 15px var(--accent), 0 0 25px var(--accent);
}

.navbar button:active {
  transform: scale(0.95);
}

@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-15px); }
  to { opacity: 1; transform: translateY(0); }
}

.navbar {
  animation: fadeInDown 0.6s ease;
}

/* Containers */
.container {
  display: none;
  max-width: 720px;
  margin: 20px auto;
  padding: 10px;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.4s ease;
}

.container.active {
  display: block;
  opacity: 1;
  transform: translateY(0);
}

/* Inputs */
input, button {
  width: 100%;
  max-width: 500px;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
}

/* Headings */
h1, h2 {
  font-family: 'Orbitron', sans-serif;
  text-shadow:
    0 0 8px rgba(255,255,255,0.8),
    0 0 16px rgba(0,255,255,0.5);
}

/* Results animation */
.result {
  margin-top: 15px;
  text-align: left;
  opacity: 0;
  transform: translateY(15px);
  transition: all 0.5s ease;
}

.result.show {
  opacity: 1;
  transform: translateY(0);
}

.result img {
  max-width: 260px;
  border-radius: 8px;
  margin-top: 10px;
  display: block;
  opacity: 0;
  transform: scale(0.9);
  transition: all 0.6s ease;
}

.result img.loaded {
  opacity: 1;
  transform: scale(1);
}

.result h2 {
  opacity: 0;
  transform: translateX(-15px);
  animation: slideIn 0.5s ease forwards;
  animation-delay: 0.1s;
}

.result p, .result div {
  opacity: 0;
  animation: fadeUp 0.5s ease forwards;
}

.result p { animation-delay: 0.2s; }
.result div { animation-delay: 0.3s; }

@keyframes slideIn {
  to { opacity: 1; transform: translateX(0); }
}

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

/* Input focus transitions */
input:focus, button:focus {
  outline: none;
  box-shadow: 0 0 0 3px rgba(76,175,80,0.5);
  transition: box-shadow 0.3s ease;
}

input {
  transition: transform 0.2s ease, box-shadow 0.3s ease;

input:focus {
  transform: scale(1.02);
}

/* Loader */
.loader {

  width: 30px;
  height: 30px;

}

<script>
(function(){
  var burger = document.getElementById('jmcnavBurger');
  var mobile = document.getElementById('jmcnavMobile');
  if(burger && mobile){
    burger.addEventListener('click', function(){
      burger.classList.toggle('open');
      mobile.classList.toggle('open');
    });
  }
  document.addEventListener('pointerdown', function(e){
    var el = e.target.closest('.jmcnav-app, .jmcnav-app-mobile, .jmcnav-links a');
    if(!el) return;
    var rect = el.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height) * 1.8;
    var span = document.createElement('span');
    span.className = 'jmcnav-ripple';
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - rect.left - size/2) + 'px';
    span.style.top = (e.clientY - rect.top - size/2) + 'px';
    if(getComputedStyle(el).position === 'static') el.style.position = 'relative';
    el.style.overflow = 'hidden';
    el.appendChild(span);
    span.addEventListener('animationend', function(){ span.remove(); });
  });
})();
</script>


<div class="navbar">
  <button onclick="showSection('dictionary')">Dictionary</button>

<!-- DICTIONARY -->
<div id="dictionary" class="container active">
  <input type="text" id="dict-query" placeholder="Enter a word..."
    onkeydown="if(event.key==='Enter')searchDictionary()">
  <button onclick="searchDictionary()">Define</button>
  <div id="dict-result" class="result"></div>
</div>

<script>

function showSection(id){
  document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* Dictionary */
async function searchDictionary(){
  const word = document.getElementById("dict-query").value.trim();
  const result = document.getElementById("dict-result");

  if(!word) return;

  result.classList.remove("show");
  result.innerHTML = `<div class="loader"></div>`;

  let entry = null;
  let pronunciationText = "";
  let audioHTML = "";
  let meaningsHTML = "";

  try {
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    if(res.ok){
      const data = await res.json();
      entry = data[0];
    }
  } catch {}

  if(entry){
    if(entry.phonetics?.length){
      const phonetic = entry.phonetics.find(p => p.text || p.audio);
      if(phonetic?.text) pronunciationText = phonetic.text;
      if(phonetic?.audio){
        audioHTML = `<audio controls src="${phonetic.audio}"></audio>`;
      }
    }

    entry.meanings?.forEach(m => {
      meaningsHTML += `<p><b>${m.partOfSpeech}:</b></p><ul>`;
      m.definitions.slice(0,3).forEach(d => {
        meaningsHTML += `<li>${d.definition}</li>`;
      });
      meaningsHTML += `</ul>`;
    });
  }

  // Try to fetch a relevant image (silently ignore failures)
  let imageHTML = "";
  try {
    const imgRes = await fetch(`https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&pithumbsize=300&format=json&origin=*&titles=${encodeURIComponent(word)}`);
    if(imgRes.ok){
      const imgData = await imgRes.json();
      const pages = imgData?.query?.pages || {};
      const firstPage = Object.values(pages)[0];
      const src = firstPage?.thumbnail?.source;
      if(src){
        imageHTML = `<img src="${src}" onload="this.classList.add('loaded')" alt="${word}">`;
      }
    }
  } catch {}

  const displayWord = entry?.word || word;

  result.innerHTML = `
    <h2>${displayWord}</h2>
    ${imageHTML}
    ${pronunciationText ? `<p><b>Pronunciation:</b> ${pronunciationText}</p>` : ""}
    ${audioHTML}
    ${meaningsHTML ? `<div><b>Definitions:</b>${meaningsHTML}</div>` : `<div><i>No definitions available — try another word.</i></div>`}
  `;

  // Trigger image animation in case it was cached/instant
  const img = result.querySelector("img");
  if(img && img.complete) img.classList.add("loaded");

  setTimeout(()=> result.classList.add("show"), 50);
}

</script>
